name: VOID LEADS - CI quick tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pytest pillow
      - run: python -m pytest -q
      - run: node --check static/app.js
      - run: python packaging/make_icon.py
      - name: Check icon exists
        shell: pwsh
        run: |
          if (!(Test-Path assets/void-leads.ico)) { throw "Windows icon missing" }
